name: K3Test Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0 platforms;android-35 ndk;27.0.12077973

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build Rust (arm64)
        run: |
          set -e
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" || echo "checking $ANDROID_HOME"
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"; fi
          NDK="$ANDROID_NDK_HOME"
          if [ ! -d "$NDK" ]; then NDK="$ANDROID_HOME/ndk/27.0.12077973"; fi
          echo "NDK=$NDK"
          export CC_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          export CXX_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          cargo build --target aarch64-linux-android --release
          ls -lh target/aarch64-linux-android/release/libk3test.so

      - name: Stage JNI lib
        run: |
          mkdir -p .local/android/gradle-jni/arm64-v8a
          cp target/aarch64-linux-android/release/libk3test.so .local/android/gradle-jni/arm64-v8a/
          "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded .local/android/gradle-jni/arm64-v8a/libk3test.so
          mkdir -p .local/android
          keytool -genkeypair -keystore .local/android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 3650 -dname "CN=K3Test Dev" || true
          ls -lh .local/android/gradle-jni/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14

      - name: Build APK
        run: |
          cd packaging/android
          gradle assembleDebug --info 2>&1 | tail -60
          find ../../.local/android -type f \( -name '*.apk' -o -name '*.so' \) -print
          find . -type f -name '*.apk' -print | head -10

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: k3test-debug-apk
          path: packaging/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
