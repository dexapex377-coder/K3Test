[package]
name = "k3test"
version = "0.1.0"
edition = "2021"
description = "K3Test — Phase 1.0 mobile-first wgpu viewport (PowerVR/Mali/Adreno)"
license = "MIT"

[lib]
name = "k3test"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl", "naga-ir"] }
jni = { version = "0.21", default-features = false }
ndk-sys = "0.6"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
log = "0.4"
android_logger = { version = "0.15", default-features = false }
glam = "0.30"
